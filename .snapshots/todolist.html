<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps </title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

</head>
<style>
    #map {
        height: 500px;
    }
    .popup-image{
       max-width: 200px;
        height: auto;
        object-fit: fill;
    }
</style>
<body>
    <h1>Simple Maps</h1>
    <div id="map"></div>
    
</body>
<script>
   
   
   function initMap(mapDataUrl) {
    //Render map
    const map = L.map('map').setView([8.360, 124.868], 17);

   
    //OpenStreetMap tile Layer
    const openStreetMapLayer = L.tileLayer('https://tiles.openstreetmap.org/{z}/{x}/{y}.png',{
        maxZoom: 19,
        attribution:'&copy; <a href="http://www.openstreetmap.org/copyright">openstreetmap</a>'
    });

    //satellite Layer
    const satelite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/world_imagery/MapServer/title/{Z}/{y}/{x}',
        {attribution: 'Tiles (c) Esri-, Maxar, Earthstar Geographics, & GIS User Community '}
    );



    

    //Render Pins
     fetch(mapDataUrl)
     .then(response=>response.json())
     .then(data=>{
       
            data.forEach(pin=>{
                 const marker = L.marker([pin.lat,pin.lng]).addTo(map);

                 const image= ` <img src=' ${pin.image}' class ="popup-image">`;

                 marker.bindPopup(`
                    ${pin.title} <br> 
                <hr>
                ${image}
                 `);

        });

       
     });
    }
    //Layer Control
    const  baseMaps ={
        "OpenStreetMap": openStreetMap,
        "Satellite": Satellite
    }
   
initMap('campus-map.json');

</script>
</html>
